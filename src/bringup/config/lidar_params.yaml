lidar_detector:
  ros__parameters:
    topics:
      sub_lidar: "/carla/hero/lidar"
      pub_lidar: "/perception/lidar"
    roi:
      x_min: 0.0
      x_max: 25.0
      y_min: -5
      y_max: 5.0
      z_min: -1.0
      z_max: 1.0
    ransac:
      distance_threshold: 0.15
    clustering:
      tolerance: 0.3
      min_size: 3
      max_size: 150